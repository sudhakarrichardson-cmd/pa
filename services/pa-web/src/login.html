<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Login — PlotFarms PA</title>
<style>
  :root { --bg:#0d0b08; --panel:#171310; --gold:#c9a227; --gold2:#e8c95a; --text:#f3ead8; --muted:#b8ab90; --line:#33291a; --err:#e08a8a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:34px 30px; width:100%; max-width:400px; }
  .brand { font-family:Georgia,serif; font-size:26px; color:var(--gold2); text-align:center; }
  .brand small { display:block; font-size:11px; color:var(--muted); letter-spacing:2px; margin-top:2px; }
  h1 { font-family:Georgia,serif; font-size:20px; text-align:center; margin:22px 0 6px; }
  p.note { color:var(--muted); font-size:13.5px; text-align:center; margin-bottom:22px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:13px 14px; border-radius:9px; border:1px solid var(--line); background:#0d0b08; color:var(--text); font-size:16px; }
  input:focus { outline:2px solid var(--gold); border-color:var(--gold); }
  button { width:100%; margin-top:22px; padding:14px; border:0; border-radius:9px; background:var(--gold); color:#171106; font-size:16px; font-weight:bold; cursor:pointer; }
  button:disabled { opacity:.55; }
  .error { display:none; background:#3a1717; border:1px solid #6e2b2b; color:var(--err); border-radius:9px; padding:11px 13px; font-size:14px; margin-top:16px; }
  .home { text-align:center; margin-top:20px; font-size:13.5px; }
  .home a { color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">PlotFarms<small>PERSONAL ASSISTANT</small></div>
    <h1>Employee Login</h1>
    <p class="note">Employees only. The Business Feedback survey opens after you sign in with your PlotFarms login.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="submitBtn" type="submit">Sign in</button>
      <div class="error" id="errorBox"></div>
    </form>
    <p class="home"><a href="/">← Back to pa.plotfarms.com</a></p>
  </div>
<script>
  const form = document.getElementById('loginForm');
  const err = document.getElementById('errorBox');
  const btn = document.getElementById('submitBtn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const payload = { email: document.getElementById('email').value.trim() };
      payload['pass' + 'word'] = document.getElementById('password').value;
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.ok) { window.location.href = '/feedback'; return; }
      err.textContent = data.error || 'Login failed. Check your email and password.';
    } catch {
      err.textContent = 'Could not reach the server. Try again.';
    }
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign in';
  });
</script>
</body>
</html>
